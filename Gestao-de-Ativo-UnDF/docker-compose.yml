services:
  web:
    build: .
    container_name: patrimonio_web
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-local-development-secret-key-12345
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # ─── Supabase ──────────────────────────────────────────────────────────
      # Substitua pelos valores reais do Supabase Dashboard (Connect dialog)
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-ativos-imagens}
      # ─── JWT ───────────────────────────────────────────────────────────────
      - JWT_SECRET_KEY=django-insecure-local-development-secret-key-12345
      - JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
      # ─── CORS ──────────────────────────────────────────────────────────────
      - CORS_ALLOW_ALL_ORIGINS=True
